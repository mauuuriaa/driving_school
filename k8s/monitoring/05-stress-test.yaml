apiVersion: v1
kind: Namespace
metadata:
  name: stress
---
# Memory stress: съест больше лимита 200Mi -> OOMKilled
apiVersion: v1
kind: Pod
metadata:
  name: memory-stress
  namespace: stress
  labels:
    app: memory-stress
spec:
  restartPolicy: Never
  containers:
    - name: stress
      image: polinux/stress:1.0.4
      command: ["stress"]
      args: ["--vm", "1", "--vm-bytes", "400M", "--vm-hang", "0"]
      resources:
        requests:
          memory: 100Mi
        limits:
          memory: 200Mi
---
# CPU stress: лимит 100m, будет троттлиться
apiVersion: v1
kind: Pod
metadata:
  name: cpu-stress
  namespace: stress
  labels:
    app: cpu-stress
spec:
  restartPolicy: Never
  containers:
    - name: stress
      image: polinux/stress:1.0.4
      command: ["stress"]
      args: ["--cpu", "2", "--timeout", "300s"]
      resources:
        requests:
          cpu: 50m
        limits:
          cpu: 100m