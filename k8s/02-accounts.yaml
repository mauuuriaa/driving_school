apiVersion: batch/v1
kind: Job
metadata:
  name: accounts-migrate
  namespace: driving-school
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: mariiiia123/driving-school-accounts:v1
          imagePullPolicy: IfNotPresent
          command: ["python", "manage.py", "migrate", "--noinput"]
          envFrom:
            - configMapRef:
                name: accounts-config
            - secretRef:
                name: app-secret
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: accounts
  namespace: driving-school
spec:
  replicas: 2
  selector:
    matchLabels:
      app: accounts
  template:
    metadata:
      labels:
        app: accounts
    spec:
      containers:
        - name: accounts
          image: mariiiia123/driving-school-accounts:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: accounts-config
            - secretRef:
                name: app-secret
          readinessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: accounts
  namespace: driving-school
spec:
  selector:
    app: accounts
  ports:
    - port: 8000
      targetPort: 8000