apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: media-data
  namespace: driving-school
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: batch/v1
kind: Job
metadata:
  name: school-migrate
  namespace: driving-school
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: mariiiia123/driving-school-school:v1
          imagePullPolicy: IfNotPresent
          command: ["python", "manage.py", "migrate", "--noinput"]
          envFrom:
            - configMapRef:
                name: school-config
            - secretRef:
                name: app-secret
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: school
  namespace: driving-school
spec:
  replicas: 3
  selector:
    matchLabels:
      app: school
  template:
    metadata:
      labels:
        app: school
    spec:
      containers:
        - name: school
          image: mariiiia123/driving-school-school:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: school-config
            - secretRef:
                name: app-secret
          readinessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
          volumeMounts:
            - name: media
              mountPath: /app/media
      volumes:
        - name: media
          persistentVolumeClaim:
            claimName: media-data
---
apiVersion: v1
kind: Service
metadata:
  name: school
  namespace: driving-school
spec:
  selector:
    app: school
  ports:
    - port: 8000
      targetPort: 8000