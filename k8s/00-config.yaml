apiVersion: v1
kind: Namespace
metadata:
  name: driving-school
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: accounts-config
  namespace: driving-school
data:
  DJANGO_DEBUG: "0"
  DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,accounts"
  POSTGRES_DB: accounts_db
  POSTGRES_USER: driving_school
  POSTGRES_HOST: db
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: school-config
  namespace: driving-school
data:
  DJANGO_DEBUG: "0"
  DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,school"
  ACCOUNTS_URL: "http://accounts:8000"
  POSTGRES_DB: school_db
  POSTGRES_USER: driving_school
  POSTGRES_HOST: db
---
apiVersion: v1
kind: Secret
metadata:
  name: app-secret
  namespace: driving-school
type: Opaque
stringData:
  DJANGO_SECRET_KEY: change-me-in-production
  POSTGRES_PASSWORD: driving_school_pass