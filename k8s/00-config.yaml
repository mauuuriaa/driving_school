apiVersion: v1
kind: Namespace
metadata:
  name: driving-school
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: driving-school
data:
  DJANGO_DEBUG: "0"
  DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,backend"
  POSTGRES_DB: driving_school
  POSTGRES_USER: driving_school
  POSTGRES_HOST: db
---
apiVersion: v1
kind: Secret
metadata:
  name: app-secret
  namespace: driving-school
type: Opaque
stringData:
  DJANGO_SECRET_KEY: change-me-in-production
  POSTGRES_PASSWORD: driving_school_pass