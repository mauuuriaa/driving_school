name: driving-school

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: driving_school
      POSTGRES_USER: driving_school
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-driving_school_pass}"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U driving_school -d driving_school"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: .
    image: mariiiia123/driving-school-backend:${TAG:-latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DJANGO_DEBUG: "0"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,backend"
      DJANGO_SECRET_KEY: "${DJANGO_SECRET_KEY:-change-me-in-production}"
      POSTGRES_DB: driving_school
      POSTGRES_USER: driving_school
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-driving_school_pass}"
      POSTGRES_HOST: db
    volumes:
      - static_data:/app/staticfiles
      - media_data:/app/media
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn app.wsgi:application --bind 0.0.0.0:8000 --workers 3"

  web:
    build: ./client
    image: mariiiia123/driving-school-web:${TAG:-latest}
    restart: unless-stopped
    ports:
      - "8088:80"
    depends_on:
      - backend
    volumes:
      - static_data:/var/www/static:ro
      - media_data:/var/www/media:ro

volumes:
  pg_data:
  static_data:
  media_data:
  